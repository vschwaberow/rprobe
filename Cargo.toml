[package]
name = "rprobe"
version = "0.10.0"
edition = "2021"
license = "MIT"
authors = ["Volker Schwaberow <volker@schwaberow.de>"]
homepage = "https://github.com/vschwaberow/rprobe.git"
repository = "https://github.com/vschwaberow/rprobe.git"
description = "A simple tool to probe a remote host http or https connection"
keywords = ["rust", "network", "security", "network"]
categories = ["command-line-utilities"]

[[bin]]
name = "rprobe"
path = "src/main.rs"

[lib]
name = "rprobe"
path = "src/lib.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = "symbols"
lto = true
codegen-units = 1
opt-level = "s"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6.6", features = ["derive"] }
indicatif = { version = "0.18.6", features = ["rayon"] }
governor = "0.10.4"
reqwest = { version = "0.13.5", features = ["blocking"] }
regex = "1.13.1"
aho-corasick = "1.1"
log = "0.4.34"
simple_logger = "5.2.0"
futures = "0.3.34"
once_cell = "1.21.4"
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0"
url = "2.5"
rand = "0.10"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1.0"
lru = "0.18"
# Storage layer dependencies
sled = { version = "0.34", features = ["compression"] }
bincode = { version = "=2.0.1", features = ["serde"] }
bincode1 = { package = "bincode", version = "1.3" }
dirs = "7.0"
anyhow = "1.0"
uuid = { version = "1.26", features = ["v4", "serde"] }

[dev-dependencies]
wiremock = "0.6"
mockito = "1.7"
tokio-test = "0.4"
serial_test = "4.0"
pretty_assertions = "1.4"
rstest = "0.27"
test-case = "3.3"
assert_fs = "1.1"
predicates = "3.1"
